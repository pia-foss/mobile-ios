name: Translate and Update Release Notes

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's New text (in English)"
        required: true
        type: string
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: 'ios + macos'
        options:
          - ios + macos
          - tvos

jobs:
  translate-and-update:
    runs-on: macos-latest

    env:
      # The dropdown label is for humans; fastlane takes ios|tvos, and the
      # ios lane covers the Mac Catalyst version off the same metadata folder.
      FASTLANE_PLATFORM: ${{ inputs.platform == 'tvos' && 'tvos' || 'ios' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Write English release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p "fastlane/metadata/$FASTLANE_PLATFORM/en-US"
          echo "$RELEASE_NOTES" > "fastlane/metadata/$FASTLANE_PLATFORM/en-US/release_notes.txt"
          cat "fastlane/metadata/$FASTLANE_PLATFORM/en-US/release_notes.txt"

      - name: Translate release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bundle exec fastlane translate_release_notes platform:$FASTLANE_PLATFORM

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          bundle exec fastlane update_release_notes platform:$FASTLANE_PLATFORM
